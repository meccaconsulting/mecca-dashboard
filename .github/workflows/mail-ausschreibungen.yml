name: Mail Ausschreibungen

# Woechentliche Mail, nachdem alle vorherigen Schritte durch sind:
#   Samstag 18:00 UTC  Feed (Workflow "Update Ausschreibungen", GitHub startet oft 4-6 h spaeter)
#   Sonntag 05:00 UTC  Claude-Bewertung (zweiter Lauf 15:00 UTC)
#   Montag 06:00 UTC   diese Mail (= 07:00 Wien im Winter, 08:00 im Sommer;
#                      GitHub verzoegert geplante Laeufe oft um Stunden)
# Die Mail wird jede Woche gesendet. Sie warnt, wenn Scraping oder Bewertung nicht gelaufen sind.

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      since_days:
        description: "Treffer, die in den letzten n Tagen bewertet wurden"
        default: "7"
      dry_run:
        description: "true = nur Vorschau, keine Mail"
        default: "false"

permissions:
  contents: read

concurrency:
  group: mail-ausschreibungen
  cancel-in-progress: false

jobs:
  mail:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Mail erzeugen und senden
        env:
          MAIL_SERVER: ${{ secrets.MAIL_SERVER }}
          MAIL_PORT: ${{ secrets.MAIL_PORT }}
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ vars.MAIL_TO }}
          SINCE_DAYS: ${{ github.event.inputs.since_days }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          ARGS="--since-days ${SINCE_DAYS:-7}"
          if [ "$DRY_RUN" = "true" ]; then ARGS="$ARGS --dry-run --out-dir $RUNNER_TEMP/mail_preview"; fi
          python3 scripts/send_weekly_mail.py $ARGS
          if [ "$DRY_RUN" = "true" ]; then cat "$RUNNER_TEMP/mail_preview/mail.txt"; fi
