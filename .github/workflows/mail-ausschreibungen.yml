name: Mail Ausschreibungen
# Vorschau-Laeufe (dry_run) bekommen einen eigenen Namen, damit die
# Pruefung unten sie nicht als "Mail schon gesendet" zaehlt.
run-name: ${{ inputs.dry_run == 'true' && 'Mail Vorschau' || 'Mail Ausschreibungen' }}

# Woechentliche Mail, nachdem alle vorherigen Schritte durch sind:
#   Samstag 17:41 UTC  Feed (Workflow "Update Ausschreibungen", GitHub startet oft 4-6 h spaeter)
#   Sonntag 05:00 UTC  Claude-Bewertung (zweiter Lauf 15:00 UTC)
#   Montag 04:37 UTC   diese Mail (= 05:37 Wien im Winter, 06:37 im Sommer)
#   Montag 09:23 UTC   Reserve, falls GitHub den ersten Lauf verschluckt
# GitHub verzoegert geplante Laeufe zur vollen Stunde oft um Stunden oder laesst
# sie ganz aus, daher ungerade Minuten und ein zweiter Termin. Ein geplanter Lauf
# sendet nur, wenn seit Montag 00:00 UTC noch kein Lauf erfolgreich gesendet hat
# (auch ein manueller zaehlt). Manuelle Laeufe senden immer.
# Die Mail warnt, wenn Scraping oder Bewertung nicht gelaufen sind.

on:
  schedule:
    - cron: "37 4 * * 1"
    - cron: "23 9 * * 1"
  workflow_dispatch:
    inputs:
      since_days:
        description: "Treffer, die in den letzten n Tagen bewertet wurden"
        default: "7"
      dry_run:
        description: "true = nur Vorschau, keine Mail"
        default: "false"

permissions:
  contents: read
  actions: read

concurrency:
  group: mail-ausschreibungen
  cancel-in-progress: false

jobs:
  mail:
    runs-on: ubuntu-latest
    steps:
      - name: Diese Woche schon gesendet?
        id: check
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          MONDAY=$(date -u -d "$(( $(date -u +%u) - 1 )) days ago" +%F)
          SENT=$(gh api "repos/${{ github.repository }}/actions/workflows/mail-ausschreibungen.yml/runs?status=success&created=>=${MONDAY}&per_page=50" \
            --jq "[.workflow_runs[] | select(.id != ${{ github.run_id }} and .display_title == \"Mail Ausschreibungen\")] | length")
          echo "Erfolgreiche Mail-Laeufe seit ${MONDAY}: ${SENT}"
          if [ "$SENT" -gt 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Mail ging diese Woche schon raus, dieser Lauf sendet nicht."
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.skip != 'true'

      - name: Mail erzeugen und senden
        if: steps.check.outputs.skip != 'true'
        env:
          MAIL_SERVER: ${{ secrets.MAIL_SERVER }}
          MAIL_PORT: ${{ secrets.MAIL_PORT }}
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ vars.MAIL_TO }}
          SINCE_DAYS: ${{ github.event.inputs.since_days }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          ARGS="--since-days ${SINCE_DAYS:-7}"
          if [ "$DRY_RUN" = "true" ]; then ARGS="$ARGS --dry-run --out-dir $RUNNER_TEMP/mail_preview"; fi
          python3 scripts/send_weekly_mail.py $ARGS
          if [ "$DRY_RUN" = "true" ]; then cat "$RUNNER_TEMP/mail_preview/mail.txt"; fi
